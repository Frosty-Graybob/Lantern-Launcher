# Publishes the server's Docker image to GitHub's container registry (ghcr.io), for
# both regular PCs/servers (amd64) and ARM boxes like a Raspberry Pi (arm64).
#
# To publish a version:   git tag server-v1.1.0 && git push --tags
# (or run it by hand from the repository's "Actions" tab).
# Afterwards, set the image's visibility to Public in the repository's "Packages"
# settings so other people's servers can pull it without logging in.

name: Publish server image

on:
  push:
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registry names must be lowercase; GitHub user names may not be.
      - name: Work out the image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/game-launcher-server" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=server-v(.*),group=1
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
